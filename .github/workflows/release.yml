name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept SDK licenses & install platform 34
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(find "$ANDROID_HOME" -name sdkmanager -type f -print -quit 2>/dev/null)"
          if [ -z "$SDKM" ]; then echo "sdkmanager not found"; exit 1; fi
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode permanent release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d "[:space:]" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "[OK] Permanent release keystore loaded."
          else
            echo "[WARN] KEYSTORE_BASE64 secret not set; using temporary debug signing."
          fi

      - name: Run unit tests (theme + update + voice)
        run: gradle :core:theme:testDebugUnitTest :core:update:testDebugUnitTest :core:voice:testDebugUnitTest --stacktrace

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK & generate verified version.json
        run: |
          VN="${GITHUB_REF_NAME#v}"
          APK="app/build/outputs/apk/release/Ahmed_BYD_Voice_v${VN}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -n 1)
          python3 -c '
          import json, sys
          vc, vn, tag, sha = int(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4]
          data = {
              "versionCode": vc,
              "versionName": vn,
              "url": f"https://github.com/Alkaraonge/Ahmed_BYD_Voice/releases/download/{tag}/Ahmed_BYD_Voice_v{vn}.apk",
              "sha256": sha,
              "changelog": f"إصدار {vn} من أحمد للبرمجة"
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          ' "$VC" "$VN" "$GITHUB_REF_NAME" "$SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/Ahmed_BYD_Voice_v*.apk
            version.json
